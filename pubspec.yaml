name: groovy_inventory
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  logger: ^2.7.0
  cupertino_native_better: ^1.5.0
  dio: ^5.9.2
  flutter_secure_storage: ^10.3.1
  lottie: ^3.3.3
  dotlottie_loader: ^0.0.6
  flutter_riverpod: ^3.3.2
  intl: ^0.20.2
  pull_down_button: ^0.10.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/animations/

  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SFPRODISPLAYREGULAR.OTF
          weight: 400
        - asset: assets/fonts/SFPRODISPLAYMEDIUM.OTF
          weight: 500
        - asset: assets/fonts/SFPRODISPLAYBOLD.OTF
          weight: 700
